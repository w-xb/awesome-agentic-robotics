name: awesome-lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository structure
        run: python3 scripts/validate_list.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes awesome-lint
